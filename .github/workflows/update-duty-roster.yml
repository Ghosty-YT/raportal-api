name: Update Duty Roster JSON

on:
  workflow_dispatch:
  schedule:
    # Runs at 10:30am Auckland time
    - cron: "30 10 * * *"
      timezone: "Pacific/Auckland"

    # Runs at 6:30pm Auckland time
    - cron: "30 18 * * *"
      timezone: "Pacific/Auckland"

permissions:
  contents: write

concurrency:
  group: update-duty-roster-json
  cancel-in-progress: true

env:
  ROSTER_FILE: duty-shifts-updated-event-team.min.json

jobs:
  update-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug SharePoint access
        run: |
          echo "Testing SharePoint download without exposing the secret URL..."
          echo "Secret URL length: ${#SHAREPOINT_ROSTER_URL}"

          STATUS=$(curl -L --silent --show-error \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://uoa-my.sharepoint.com/" \
            -D debug_headers.txt \
            -o debug_response.txt \
            -w "%{http_code}" \
            "${SHAREPOINT_ROSTER_URL}" || true)

          echo "HTTP status: ${STATUS}"

          CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {ct=$0} END {gsub(/\r/,"",ct); print ct}' debug_headers.txt)
          echo "Content type: ${CONTENT_TYPE:-unknown}"

          BYTES=$(wc -c < debug_response.txt | tr -d ' ')
          echo "Bytes downloaded in debug test: ${BYTES}"

          node <<'NODE'
          const fs = require("fs");

          const file = "debug_response.txt";
          if (!fs.existsSync(file)) {
            console.log("No debug response file created.");
            process.exit(0);
          }

          const text = fs.readFileSync(file, "utf8").trim();

          if (!text) {
            console.log("Debug response is empty.");
            process.exit(0);
          }

          if (text.startsWith("<")) {
            const preview = text
              .slice(0, 500)
              .replace(/\s+/g, " ")
              .replace(/https?:\/\/[^\s"'<>]+/g, "[URL hidden]");
            console.log("Debug response looks like HTML, preview:");
            console.log(preview);
            process.exit(0);
          }

          try {
            const data = JSON.parse(text);
            console.log("Debug response looks like valid JSON.");
            console.log("Top-level keys:", Object.keys(data).join(", "));
            if (Array.isArray(data.shifts)) console.log("shifts:", data.shifts.length);
            if (Array.isArray(data.paycycle_entries)) console.log("paycycle_entries:", data.paycycle_entries.length);
            if (Array.isArray(data.event_team)) console.log("event_team:", data.event_team.length);
          } catch (error) {
            console.log("Debug response is not HTML and not valid JSON.");
            console.log("First 300 characters:");
            console.log(text.slice(0, 300));
          }
          NODE
        env:
          SHAREPOINT_ROSTER_URL: ${{ secrets.SHAREPOINT_ROSTER_URL }}

      - name: Test and download latest roster JSON from SharePoint
        run: |
          curl -L --fail --silent --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://uoa-my.sharepoint.com/" \
            "${SHAREPOINT_ROSTER_URL}" \
            -o "${ROSTER_FILE}"

          echo "Downloaded file size:"
          wc -c "${ROSTER_FILE}"
        env:
          SHAREPOINT_ROSTER_URL: ${{ secrets.SHAREPOINT_ROSTER_URL }}

      - name: Validate roster JSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const filePath = process.env.ROSTER_FILE;
          const text = fs.readFileSync(filePath, "utf8").trim();

          if (!text) {
            throw new Error("Downloaded file is empty.");
          }

          if (
            text.startsWith("<!DOCTYPE") ||
            text.startsWith("<html") ||
            text.includes("<body") ||
            text.includes("Sign in") ||
            text.includes("Access denied")
          ) {
            throw new Error("Downloaded HTML/login/error page instead of JSON. Check the SharePoint download link.");
          }

          let data;
          try {
            data = JSON.parse(text);
          } catch (error) {
            throw new Error("Downloaded file is not valid JSON: " + error.message);
          }

          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("Roster JSON must be a top-level object.");
          }

          if (!Array.isArray(data.shifts)) {
            throw new Error("Missing or invalid shifts array.");
          }

          if (!Array.isArray(data.paycycle_entries)) {
            throw new Error("Missing or invalid paycycle_entries array.");
          }

          if (!Array.isArray(data.event_team)) {
            throw new Error("Missing or invalid event_team array.");
          }

          if (data.shifts.length === 0) {
            throw new Error("shifts array is empty.");
          }

          if (data.paycycle_entries.length === 0) {
            throw new Error("paycycle_entries array is empty.");
          }

          // Minify to keep the API file small and stable.
          fs.writeFileSync(filePath, JSON.stringify(data));

          console.log("Valid roster JSON.");
          console.log("shifts:", data.shifts.length);
          console.log("paycycle_entries:", data.paycycle_entries.length);
          console.log("event_team:", data.event_team.length);
          NODE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${ROSTER_FILE}"

          if git diff --cached --quiet; then
            echo "No roster changes to commit."
          else
            git commit -m "Auto-update duty roster"
            git push
          fi
