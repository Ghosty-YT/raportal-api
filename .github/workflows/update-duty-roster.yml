name: Update Duty Roster JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"
      timezone: "Pacific/Auckland"
    - cron: "30 18 * * *"
      timezone: "Pacific/Auckland"

permissions:
  contents: write

concurrency:
  group: update-duty-roster-json
  cancel-in-progress: true

jobs:
  update-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Download Sem 1 roster JSON from SharePoint
        run: node scripts/download-sharepoint.js
        env:
          SHAREPOINT_URL: ${{ secrets.SHAREPOINT_SEM1_URL }}
          OUTPUT_FILE: sem1-source.json

      - name: Download Sem 2 roster JSON from SharePoint
        run: node scripts/download-sharepoint.js
        env:
          SHAREPOINT_URL: ${{ secrets.SHAREPOINT_SEM2_URL }}
          OUTPUT_FILE: sem2-source.json

      - name: Validate source JSON files
        run: |
          node -e "
          const fs = require('fs');
          for (const file of ['sem1-source.json', 'sem2-source.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(data.shifts)) throw new Error(file + ' missing shifts array');
            if (!Array.isArray(data.paycycle_entries)) throw new Error(file + ' missing paycycle_entries array');
            if (!Array.isArray(data.event_team)) throw new Error(file + ' missing event_team array');
            console.log(file, {
              shifts: data.shifts.length,
              paycycle_entries: data.paycycle_entries.length,
              event_team: data.event_team.length
            });
          }
          "

      - name: Merge Sem 1 and Sem 2 JSON
        run: node scripts/merge-roster-json.js

      - name: Generate RA calendar ICS files
        run: node scripts/generate-ics.js
        env:
          BASE_CALENDAR_URL: https://raw.githubusercontent.com/Ghosty-YT/raportal-api/main/calendars

      - name: Save source JSON copies
        run: |
          mkdir -p sources
          cp sem1-source.json sources/duty-shifts-sem1.min.json
          cp sem2-source.json sources/duty-shifts-sem2.min.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add duty-shifts-updated-event-team.min.json
          git add calendars
          git add sources/duty-shifts-sem1.min.json
          git add sources/duty-shifts-sem2.min.json

          if git diff --cached --quiet; then
            echo "No roster/calendar changes to commit."
          else
            git commit -m "Auto-update roster and calendars"
            git push
          fi
